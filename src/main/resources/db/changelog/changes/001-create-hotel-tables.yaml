databaseChangeLog:
  - changeSet:
      id: 001-create-hotel-tables
      author: iverbitskiy
      changes:
        - createTable:
            tableName: hotel
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(4000)
              - column:
                  name: brand
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: house_number
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: street
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: city
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: country
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: post_code
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: phone
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: check_in
                  type: TIME
                  constraints:
                    nullable: false
              - column:
                  name: check_out
                  type: TIME
        - createTable:
            tableName: hotel_amenity
            columns:
              - column:
                  name: hotel_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: amenity
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: amenity_order
                  type: INT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            constraintName: fk_hotel_amenity_hotel
            baseTableName: hotel_amenity
            baseColumnNames: hotel_id
            referencedTableName: hotel
            referencedColumnNames: id
            onDelete: CASCADE
        - addPrimaryKey:
            constraintName: pk_hotel_amenity
            tableName: hotel_amenity
            columnNames: hotel_id, amenity_order
